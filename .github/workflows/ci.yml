# OroGest Lex — CI/CD Pipeline
# Estudio Oro S.A.S.

name: OroGest Lex CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "postgresql+asyncpg://orogest:orogest@localhost:5432/orogest_lex_test"
  REDIS_URL: "redis://localhost:6379/0"
  SECRET_KEY: "test-secret-key-ci-only-not-for-production"
  ENCRYPTION_KEY: "test-encryption-key-ci-only"
  CLAUDE_API_KEY: ""
  DEBUG: "true"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orogest
          POSTGRES_PASSWORD: orogest
          POSTGRES_DB: orogest_lex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run seed (smoke test)
        run: python -m scripts.seed

  security:
    name: Security Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip install -e .
      - name: Audit third-party dependencies
        run: |
          # --skip-editable + --strict fails outright ("distribution marked as
          # editable" is treated as a hard error under --strict, not a skip),
          # so audit a frozen requirements list instead, excluding our own
          # editable-installed package (which isn't on PyPI and isn't a
          # dependency to audit).
          pip freeze | grep -v "^-e " | grep -v "^orogest-lex-backend==" > /tmp/audit-reqs.txt
          # PYSEC-2026-1325 (ecdsa, via python-jose[cryptography]): Minerva
          # timing-attack on signing/keygen. No fix exists — upstream
          # considers side-channel attacks out of scope. Accepted risk;
          # revisit if migrating off python-jose.
          pip-audit --strict -r /tmp/audit-reqs.txt --ignore-vuln PYSEC-2026-1325

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t orogest-lex-api:${{ github.sha }} .
      - name: Test Docker image
        run: |
          docker run --rm orogest-lex-api:${{ github.sha }} python -c "from app.main import app; print('OK')"
